name: Sync gh-pages
# Дашборд публікується з гілки gh-pages: дзеркалимо в неї main після кожної зміни
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:gh-pages --force
